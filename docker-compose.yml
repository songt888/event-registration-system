services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: eventreg
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d eventreg"]
      interval: 5s
      retries: 10
  # L5-03 (R-01, R-02): the same image Cloud Run runs. `docker compose up --build` migrates, seeds missing demo data, then serves UI and API on :3000.
  migrate:
    build: .
    command: ["sh", "-c", "npm run migrate -w server && npm run seed:demo -w server"]
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/eventreg
      SEED_PASSWORD: ${SEED_PASSWORD:?copy .env.example to .env and set SEED_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://app:app@db:5432/eventreg
      SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-60}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
